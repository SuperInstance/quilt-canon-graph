[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-graph"
version = "0.1.0"
description = "Knowledge graph of Quilt substrate walker canon with HTML viewer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance", email = "[email protected]"}]
keywords = ["graph", "knowledge-graph", "canon", "quilt", "substrate-walker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-canon-graph = "quilt_canon_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_graph*"]
